name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run unit and static contract tests
        run: python -m unittest discover -s tests
      - name: Validate blog metadata
        run: python scripts/validate_blog.py
